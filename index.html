<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Chat</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 10px 12px; border-radius: 10px; font-size: 14px; word-break: break-word; }
        .sent { background: #dcf8c6; align-self: flex-end; }
        .received { background: white; align-self: flex-start; }
        .system { background: #fff3cd; align-self: center; font-size: 12px; }
        #input-area { display: flex; padding: 8px; background: #f0f0f0; }
        #msg-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        #send-btn { background: #128c7e; color: white; border: none; padding: 10px 18px; margin-left: 5px; border-radius: 20px; font-weight: bold; color: white; }
    </style>
</head>
<body>
    <div id="header">🔒 Anonymous Chat</div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="msg-input" placeholder="Type..." disabled>
        <button id="send-btn" disabled>Send</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');

        function addMsg(text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerText = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        socket.on('waiting', (msg) => addMsg(msg, 'system'));
        socket.on('chat_start', (msg) => {
            addMsg(msg, 'system');
            input.disabled = false;
            sendBtn.disabled = false;
        });
        socket.on('receive_message', (msg) => addMsg(msg, 'received'));
        socket.on('user_left', (msg) => {
            addMsg(msg, 'system');
            input.disabled = true;
            sendBtn.disabled = true;
        });

        function send() {
            if (input.value.trim()) {
                addMsg(input.value, 'sent');
                socket.emit('send_message', input.value);
                input.value = '';
            }
        }
        sendBtn.onclick = send;
        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
    </script>
</body>
</html>
