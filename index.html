<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mohit the secret animator boy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Mobile, Tablet & Desktop responsive height using 100dvh */
        html, body {
            height: 100%;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #e5ddd5;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: #efeae2;
            position: relative;
        }

        /* Header */
        #header {
            background: #075e54;
            color: white;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            flex-shrink: 0;
        }
        .header-title { font-weight: bold; font-size: 16px; }
        .sub-status { font-size: 11px; opacity: 0.85; margin-top: 2px; }

        /* Messages Container */
        #messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .msg {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            word-break: break-word;
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        .msg img { max-width: 100%; max-height: 250px; border-radius: 8px; display: block; margin-top: 5px; object-fit: cover; }
        .msg audio { max-width: 220px; margin-top: 5px; }

        .time { font-size: 10px; color: #777; align-self: flex-end; margin-top: 4px; }
        .sent .time { color: #557c55; }

        .sent { background: #dcf8c6; align-self: flex-end; }
        .received { background: white; align-self: flex-start; }
        .system { background: #fff3cd; align-self: center; font-size: 12px; text-align: center; cursor: default; }
        .deleted-msg { font-style: italic; color: #888; font-size: 13px; }

        /* Input Area with Safe Area Bottom Support */
        #input-area {
            display: flex;
            padding: 8px 10px;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
            background: #f0f0f0;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            border-top: 1px solid #ccc;
        }

        #msg-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 15px;
            background: white;
        }

        .btn {
            background: #128c7e;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        #send-btn {
            border-radius: 20px;
            width: auto;
            padding: 8px 16px;
        }

        #file-input { display: none; }
        .recording { background: #ff4d4d !important; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* Slide-in Settings Panel */
        #settings-panel {
            position: absolute; top: 0; right: -100%; width: 100%; height: 100%;
            background: white; transition: 0.3s ease; z-index: 99;
            display: flex; flex-direction: column;
        }
        #settings-panel.active { right: 0; }
        .settings-header { background: #075e54; color: white; padding: 15px; display: flex; align-items: center; gap: 15px; font-size: 18px; font-weight: bold; }
        .back-btn { cursor: pointer; font-size: 22px; }
        .settings-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 12px; }
        .clear-btn { background: #ff4d4d; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* Switch Toggle */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #128c7e; }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Modals */
        #action-modal, #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .action-card { background: white; width: 85%; max-width: 320px; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .action-card button { padding: 12px; border: none; background: #f0f0f0; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-align: left; }
        .action-card button.danger { color: #d9534f; background: #fdf0f0; }
        .action-card button.cancel { text-align: center; background: transparent; color: #777; margin-top: 5px; }

        #modal { background: rgba(0,0,0,0.9); flex-direction: column; }
        #modal img { max-width: 90%; max-height: 80%; border-radius: 8px; object-fit: contain; }
        #modal-tools { margin-top: 15px; display: flex; gap: 15px; }
        .modal-btn { background: #128c7e; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; text-decoration: none; cursor: pointer; }
        #close-btn { background: #ff4d4d; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Main Header -->
        <div id="header" onclick="openSettings()">
            <div>
                <div class="header-title">✨ Mohit the secret animator boy ✨</div>
                <div class="sub-status" id="status-text">Connecting...</div>
            </div>
            <span style="font-size: 20px;">⚙️</span>
        </div>

        <!-- Messages Area -->
        <div id="messages"></div>

        <!-- Input Bar -->
        <div id="input-area">
            <label for="file-input" class="btn">📷</label>
            <input type="file" id="file-input" accept="image/*">
            
            <button class="btn" id="mic-btn">🎙️</button>
            
            <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
            <button id="send-btn" class="btn">Send</button>
        </div>

        <!-- Slide-in Settings Panel -->
        <div id="settings-panel">
            <div class="settings-header">
                <span class="back-btn" onclick="closeSettings()">←</span>
                <span>Settings</span>
            </div>
            <div class="settings-body">
                <div class="setting-item">
                    <span>🔊 Message Sound (Ting)</span>
                    <label class="switch">
                        <input type="checkbox" id="sfx-toggle" onchange="toggleSFX(this)">
                        <span class="slider"></span>
                    </label>
                </div>
                <button class="clear-btn" onclick="clearHistory()">Clear Chat History</button>
            </div>
        </div>
    </div>

    <!-- Action Modal -->
    <div id="action-modal">
        <div class="action-card">
            <div style="font-weight: bold; margin-bottom: 5px;">Message Options</div>
            <button id="view-img-option" style="display:none;">🔍 View Image</button>
            <button id="del-me-btn">🗑️ Delete for Me</button>
            <button id="del-all-btn" class="danger">🗑️ Delete for Everyone</button>
            <button class="cancel" onclick="closeActionModal()">Cancel</button>
        </div>
    </div>

    <!-- Image View Modal -->
    <div id="modal">
        <img id="modal-img" src="" alt="Full View">
        <div id="modal-tools">
            <a id="download-btn" class="modal-btn" download="chat-photo.png">📥 Download</a>
            <button id="close-btn" class="modal-btn">❌ Close</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const messagesDiv = document.getElementById('messages');
        const input = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-input');
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status-text');
        const settingsPanel = document.getElementById('settings-panel');
        const sfxToggle = document.getElementById('sfx-toggle');

        const actionModal = document.getElementById('action-modal');
        const delMeBtn = document.getElementById('del-me-btn');
        const delAllBtn = document.getElementById('del-all-btn');
        const viewImgOption = document.getElementById('view-img-option');

        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const downloadBtn = document.getElementById('download-btn');
        const closeBtn = document.getElementById('close-btn');

        let selectedMsgData = null;

        // डिफ़ॉल्ट रूप से साउंड बंद ही रहेगा (Default OFF)
        window.onload = () => {
            const savedSFX = localStorage.getItem('sfx_enabled') === 'true';
            sfxToggle.checked = savedSFX;

            const savedChat = JSON.parse(localStorage.getItem('chatHistory') || '[]');
            savedChat.forEach(item => addMsgToDOM(item.id, item.content, item.type, item.mediaType, item.time, item.deleted));
        };

        function toggleSFX(el) {
            localStorage.setItem('sfx_enabled', el.checked);
        }

        function playTingSound() {
            if (!sfxToggle.checked) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e) {}
        }

        function openSettings() { settingsPanel.classList.add('active'); }
        function closeSettings() { settingsPanel.classList.remove('active'); }

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function saveMessage(id, content, type, mediaType, time, deleted = false) {
            const savedChat = JSON.parse(localStorage.getItem('chatHistory') || '[]');
            savedChat.push({ id, content, type, mediaType, time, deleted });
            localStorage.setItem('chatHistory', JSON.stringify(savedChat));
        }

        function updateLocalDeleteStatus(id, deleteType) {
            let savedChat = JSON.parse(localStorage.getItem('chatHistory') || '[]');
            if (deleteType === 'me') {
                savedChat = savedChat.filter(m => m.id !== id);
            } else if (deleteType === 'everyone') {
                savedChat = savedChat.map(m => m.id === id ? { ...m, deleted: true, content: 'This message was deleted' } : m);
            }
            localStorage.setItem('chatHistory', JSON.stringify(savedChat));
        }

        function clearHistory() {
            if (confirm("Are you sure you want to clear chat history?")) {
                localStorage.removeItem('chatHistory');
                messagesDiv.innerHTML = '';
                closeSettings();
            }
        }

        function openModal(src) {
            modalImg.src = src;
            downloadBtn.href = src;
            modal.style.display = 'flex';
        }

        closeBtn.onclick = () => { modal.style.display = 'none'; };
        modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

        function openActionModal(msgData) {
            selectedMsgData = msgData;
            if (msgData.deleted) return;

            if (msgData.mediaType === 'image') {
                viewImgOption.style.display = 'block';
                viewImgOption.onclick = () => {
                    openModal(msgData.content);
                    closeActionModal();
                };
            } else {
                viewImgOption.style.display = 'none';
            }

            actionModal.style.display = 'flex';
        }

        function closeActionModal() { actionModal.style.display = 'none'; }

        delMeBtn.onclick = () => {
            if (selectedMsgData) {
                const el = document.getElementById(`msg-${selectedMsgData.id}`);
                if (el) el.remove();
                updateLocalDeleteStatus(selectedMsgData.id, 'me');
                closeActionModal();
            }
        };

        delAllBtn.onclick = () => {
            if (selectedMsgData) {
                markAsDeletedDOM(selectedMsgData.id);
                updateLocalDeleteStatus(selectedMsgData.id, 'everyone');
                socket.emit('delete_for_everyone', selectedMsgData.id);
                closeActionModal();
            }
        };

        function markAsDeletedDOM(id) {
            const el = document.getElementById(`msg-${id}`);
            if (el) {
                el.innerHTML = '<span class="deleted-msg">🚫 This message was deleted</span>';
            }
        }

        function addMsgToDOM(id, content, type, mediaType = 'text', timeStr = '', deleted = false) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.id = `msg-${id}`;

            const msgObj = { id, content, type, mediaType, timeStr, deleted };

            if (deleted) {
                div.innerHTML = '<span class="deleted-msg">🚫 This message was deleted</span>';
            } else {
                if (mediaType === 'image') {
                    const img = document.createElement('img');
                    img.src = content;
                    div.appendChild(img);
                } else if (mediaType === 'audio') {
                    const audio = document.createElement('audio');
                    audio.src = content;
                    audio.controls = true;
                    div.appendChild(audio);
                } else {
                    const textSpan = document.createElement('span');
                    textSpan.innerText = content;
                    div.appendChild(textSpan);
                }

                if (type !== 'system') {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'time';
                    timeSpan.innerText = timeStr || getCurrentTime();
                    div.appendChild(timeSpan);
                }

                div.onclick = () => openActionModal(msgObj);
            }

            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addMsg(id, content, type, mediaType = 'text') {
            const time = getCurrentTime();
            addMsgToDOM(id, content, type, mediaType, time);
            saveMessage(id, content, type, mediaType, time);

            if (type === 'received') {
                playTingSound();
            }
        }

        socket.on('waiting', (msg) => {
            addMsgToDOM('sys_' + Date.now(), msg, 'system');
            statusText.innerText = 'Offline (Messages deliver when online)';
        });

        socket.on('chat_start', (msg) => {
            addMsgToDOM('sys_' + Date.now(), msg, 'system');
            statusText.innerText = '2nd person is Online';
        });

        socket.on('receive_message', (data) => addMsg(data.id, data.content, 'received', 'text'));
        socket.on('receive_image', (data) => addMsg(data.id, data.content, 'received', 'image'));
        socket.on('receive_audio', (data) => addMsg(data.id, data.content, 'received', 'audio'));

        socket.on('message_deleted', (msgId) => {
            markAsDeletedDOM(msgId);
            updateLocalDeleteStatus(msgId, 'everyone');
        });

        socket.on('display_typing', () => { statusText.innerText = '2nd person is typing...'; });
        socket.on('hide_typing', () => { statusText.innerText = '2nd person is Online'; });

        socket.on('user_left', (msg) => {
            addMsgToDOM('sys_' + Date.now(), msg, 'system');
            statusText.innerText = '2nd person went Offline';
        });

        let typingTimeout;
        input.addEventListener('input', () => {
            socket.emit('typing');
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { socket.emit('stop_typing'); }, 1500);
        });

        function send() {
            if (input.value.trim()) {
                const msgId = 'msg_' + Date.now();
                const msgText = input.value;
                addMsg(msgId, msgText, 'sent', 'text');
                socket.emit('send_message', { id: msgId, content: msgText });
                socket.emit('stop_typing');
                input.value = '';
            }
        }

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;
                        const max_size = 1200;

                        if (width > height) {
                            if (width > max_size) {
                                height *= max_size / width;
                                width = max_size;
                            }
                        } else {
                            if (height > max_size) {
                                width *= max_size / height;
                                height = max_size;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedData = canvas.toDataURL('image/jpeg', 0.6);
                        const msgId = 'img_' + Date.now();

                        addMsg(msgId, compressedData, 'sent', 'image');
                        socket.emit('send_image', { id: msgId, content: compressedData });
                    };
                };
                reader.readAsDataURL(file);
            }
            this.value = '';
        });

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        micBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const audioData = e.target.result;
                            const msgId = 'aud_' + Date.now();
                            addMsg(msgId, audioData, 'sent', 'audio');
                            socket.emit('send_audio', { id: msgId, content: audioData });
                        };
                        reader.readAsDataURL(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording');
                    micBtn.innerText = '🎙️';
                } catch (err) {
                    alert('Microphone permission is required!');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                micBtn.innerText = '🎙️';
            }
        };

        sendBtn.onclick = send;
        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
    </script>
</body>
</html>
