<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat App</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f2f2f7;
            display: flex;
            justify-content: center;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            background-color: #f2f2f7;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 12px 16px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #000000;
            border-bottom: 1px solid #e5e5ea;
            z-index: 20;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #007aff, #00c6ff);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #ffffff;
            flex-shrink: 0;
        }

        .header-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .header-title-input {
            font-size: 16px;
            font-weight: 600;
            color: #000000;
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            padding: 2px 0;
        }

        .header-title-input:focus {
            background: #f0f0f5;
            border-radius: 4px;
        }

        .status-text {
            font-size: 12px;
            color: #8e8e93;
        }

        .status-text.online {
            color: #34c759;
            font-weight: 500;
        }

        .header-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #007aff;
            padding: 4px;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #f2f2f7;
        }

        .date-badge {
            align-self: center;
            background-color: #e5e5ea;
            color: #8e8e93;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        /* Long Message Fix: word-break + overflow-wrap */
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: anywhere;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            white-space: pre-wrap;
        }

        .message.sent {
            align-self: flex-end;
            background-color: #007aff;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background-color: #ffffff;
            color: #000000;
            border-bottom-left-radius: 4px;
        }

        .message img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 4px;
            display: block;
        }

        .message audio {
            max-width: 100%;
            margin-top: 4px;
        }

        .msg-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            margin-top: 4px;
        }

        .msg-time {
            font-size: 10px;
            opacity: 0.75;
        }

        .message.sent .msg-time {
            color: #ffffff;
        }

        .message.received .msg-time {
            color: #8e8e93;
        }

        .delete-btn {
            background: transparent;
            color: #8e8e93;
            border: none;
            font-size: 12px;
            cursor: pointer;
            padding: 0 2px;
        }

        .message.sent .delete-btn {
            color: rgba(255, 255, 255, 0.8);
        }

        .typing-indicator {
            font-size: 12px;
            color: #007aff;
            font-style: italic;
            padding: 2px 16px;
            min-height: 18px;
            background-color: #f2f2f7;
        }

        .chat-input-area {
            padding: 8px 12px;
            background-color: #ffffff;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            border-top: 1px solid #e5e5ea;
            z-index: 30;
        }

        .input-container {
            flex: 1;
            background-color: #f2f2f7;
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 4px 12px;
            min-height: 40px;
        }

        .input-box {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #000000;
            font-size: 15px;
            max-height: 120px;
            resize: none;
            padding: 6px 0;
            line-height: 20px;
        }

        .input-box::placeholder {
            color: #8e8e93;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #007aff;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .send-btn {
            background-color: #007aff;
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 16px;
            flex-shrink: 0;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .recording {
            color: #ff3b30 !important;
            animation: recordPulse 0.8s infinite alternate;
        }

        @keyframes recordPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        #imageInput {
            display: none;
        }

        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 14px;
            width: 85%;
            max-width: 320px;
            color: #000000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .modal-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .modal-body {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .modal-btn {
            background: transparent;
            border: none;
            color: #007aff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
        }

        .modal-btn.danger {
            color: #ff3b30;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="header-left">
            <div class="avatar">✨</div>
            <div class="header-info">
                <input type="text" class="header-title-input" id="headerTitle" title="Click to edit name" value="Mohit the secret animator boy">
                <div class="status-text" id="statusText">Connecting...</div>
            </div>
        </div>
        <button class="header-btn" title="Clear Chat" onclick="confirmClearAll()">🗑️</button>
    </div>

    <div class="chat-messages" id="messageContainer">
        <div class="date-badge">Today</div>
    </div>
    <div class="typing-indicator" id="typingIndicator"></div>

    <div class="chat-input-area">
        <div class="input-container">
            <textarea class="input-box" id="msgInput" rows="1" placeholder="Type a message..."></textarea>
            <label for="imageInput" class="icon-btn">📷</label>
            <input type="file" id="imageInput" accept="image/*">
            <button class="icon-btn" id="micBtn" title="Record Voice">🎙️</button>
        </div>
        <button class="send-btn" id="sendBtn">➔</button>
    </div>

    <div class="modal-overlay" id="customModal">
        <div class="modal-card">
            <div class="modal-title" id="modalTitle">Delete message?</div>
            <div class="modal-body" id="modalBody">This message will be deleted for everyone.</div>
            <div class="modal-actions">
                <button class="modal-btn" onclick="closeModal()">Cancel</button>
                <button class="modal-btn danger" id="modalConfirmBtn">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
    const socket = io();

    let myUserId = localStorage.getItem('chat_user_id');
    if (!myUserId) {
        myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chat_user_id', myUserId);
    }

    const headerTitle = document.getElementById('headerTitle');
    const statusText = document.getElementById('statusText');
    const messageContainer = document.getElementById('messageContainer');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const imageInput = document.getElementById('imageInput');
    const micBtn = document.getElementById('micBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    let typingTimeout;
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let audioStream = null;
    let targetDeleteId = null;

    headerTitle.addEventListener('change', () => {
        socket.emit('change_title', headerTitle.value);
    });

    socket.on('title_updated', (newTitle) => {
        headerTitle.value = newTitle;
    });

    socket.on('load_history', (history) => {
        messageContainer.innerHTML = '<div class="date-badge">Today</div>';
        history.forEach(item => {
            const isSent = item.userId === myUserId;
            appendMessage(item, isSent ? 'sent' : 'received');
        });
    });

    socket.on('waiting', () => {
        statusText.innerText = 'Waiting...';
        statusText.classList.remove('online');
    });

    socket.on('chat_start', () => {
        statusText.innerText = 'Online';
        statusText.classList.add('online');
    });

    socket.on('user_left', () => {
        statusText.innerText = 'Offline';
        statusText.classList.remove('online');
    });

    msgInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
        
        socket.emit('typing');
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => socket.emit('stop_typing'), 1500);
    });

    function sendMessage() {
        const text = msgInput.value.trim();
        if (text !== '') {
            const msgData = {
                id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                userId: myUserId,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            appendMessage(msgData, 'sent');
            socket.emit('send_message', msgData);
            
            msgInput.value = '';
            msgInput.style.height = 'auto';
            socket.emit('stop_typing');
        }
    }

    sendBtn.addEventListener('click', sendMessage);

    socket.on('display_typing', () => typingIndicator.innerText = 'typing...');
    socket.on('hide_typing', () => typingIndicator.innerText = '');

    socket.on('receive_message', (data) => appendMessage(data, 'received'));

    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const msgData = {
                    id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    userId: myUserId,
                    image: event.target.result,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                appendMessage(msgData, 'sent');
                socket.emit('send_image', msgData);
            };
            reader.readAsDataURL(file);
        }
    });

    socket.on('receive_image', (data) => appendMessage(data, 'received'));

    micBtn.addEventListener('click', async () => {
        if (!isRecording) {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(audioStream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);

                mediaRecorder.onstop = () => {
                    if (audioStream) audioStream.getTracks().forEach(track => track.stop());
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const msgData = {
                            id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                            userId: myUserId,
                            audio: event.target.result,
                            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                        };
                        appendMessage(msgData, 'sent');
                        socket.emit('send_audio', msgData);
                    };
                    reader.readAsDataURL(audioBlob); // Fixed: read audioBlob instead of file
                };

                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
            } catch (err) {
                alert('Microphone permission needed.');
            }
        } else {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            isRecording = false;
            micBtn.classList.remove('recording');
        }
    });

    socket.on('receive_audio', (data) => appendMessage(data, 'received'));

    function appendMessage(data, type) {
        if (document.getElementById(data.id)) return;

        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', type);
        msgDiv.id = data.id;

        let contentHtml = '';
        if (data.text) contentHtml += `<div>${escapeHtml(data.text)}</div>`;
        if (data.image) contentHtml += `<img src="${data.image}" alt="Image">`;
        if (data.audio) contentHtml += `<audio controls src="${data.audio}"></audio>`;

        contentHtml += `
            <div class="msg-footer">
                <span class="msg-time">${data.time}</span>
                <button class="delete-btn" onclick="openDeleteModal('${data.id}')">✕</button>
            </div>`;

        msgDiv.innerHTML = contentHtml;
        messageContainer.appendChild(msgDiv);
        messageContainer.scrollTop = messageContainer.scrollHeight;
    }

    function openDeleteModal(msgId) {
        targetDeleteId = msgId;
        document.getElementById('modalTitle').innerText = 'Delete message?';
        document.getElementById('modalBody').innerText = 'This message will be deleted for everyone.';
        
        const confirmBtn = document.getElementById('modalConfirmBtn');
        confirmBtn.onclick = function() {
            socket.emit('delete_for_everyone', targetDeleteId);
            const el = document.getElementById(targetDeleteId);
            if (el) el.remove();
            closeModal();
        };

        document.getElementById('customModal').style.display = 'flex';
    }

    function confirmClearAll() {
        document.getElementById('modalTitle').innerText = 'Clear chat?';
        document.getElementById('modalBody').innerText = 'All messages will be cleared for everyone.';
        
        const confirmBtn = document.getElementById('modalConfirmBtn');
        confirmBtn.onclick = function() {
            socket.emit('clear_all_chat');
            closeModal();
        };

        document.getElementById('customModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('customModal').style.display = 'none';
    }

    socket.on('message_deleted', (msgId) => {
        const el = document.getElementById(msgId);
        if (el) el.remove();
    });

    socket.on('chat_cleared', () => {
        messageContainer.innerHTML = '<div class="date-badge">Today</div>';
    });

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
