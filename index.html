<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms - Secret Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; height: 100vh; }
        
        /* Login Screen */
        #loginScreen { width: 100%; max-width: 400px; margin: auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .login-title { text-align: center; margin-bottom: 20px; font-size: 22px; color: #0084ff; }
        .input-field { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        .btn-join { width: 100%; padding: 12px; background: #0084ff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        
        /* Chat Container (Hidden by default) */
        #chatContainer { display: none; width: 100%; max-width: 480px; height: 100vh; background: white; flex-direction: column; }
        .chat-header { padding: 12px; background: white; display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; }
        .header-title { font-weight: bold; font-size: 16px; }
        .header-subtitle { font-size: 12px; color: #666; }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f0f2f5; }
        
        .message { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 15px; position: relative; }
        .message.sent { align-self: flex-end; background: #0084ff; color: white; border-bottom-right-radius: 2px; }
        .message.received { align-self: flex-start; background: #e4e6eb; color: black; border-bottom-left-radius: 2px; }
        .sender-name { font-size: 11px; font-weight: bold; margin-bottom: 3px; opacity: 0.8; }
        
        .sys-msg { text-align: center; font-size: 12px; color: #888; margin: 10px 0; }
        
        .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        .message audio { max-width: 100%; margin-top: 5px; }
        .delete-btn { position: absolute; top: -5px; right: -5px; background: #ff3b30; color: white; width: 18px; height: 18px; border-radius: 50%; text-align: center; font-size: 10px; line-height: 18px; cursor: pointer; }
        
        .chat-input-area { padding: 10px; display: flex; gap: 8px; background: white; border-top: 1px solid #ddd; }
        .input-box { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; outline: none; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #0084ff; }
        .send-btn { background: #0084ff; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 14px; }
        .recording { color: #ff3b30 !important; animation: pulse 0.8s infinite alternate; }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.2); opacity: 0.7; } }
        #imageInput { display: none; }
    </style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen">
    <h2 class="login-title">Join a Chat Room</h2>
    <input type="text" id="username" class="input-field" placeholder="Your Name" required>
    <input type="text" id="roomName" class="input-field" placeholder="Room Name (e.g. SecretZone)" required>
    <input type="password" id="roomPass" class="input-field" placeholder="Room Password (Optional)">
    <button class="btn-join" onclick="joinRoom()">Enter Room</button>
</div>

<!-- Chat Screen -->
<div id="chatContainer">
    <div class="chat-header">
        <div>
            <div class="header-title" id="roomTitle">Room</div>
            <div class="header-subtitle" id="userNameDisplay"></div>
        </div>
        <div>
            <button class="icon-btn" onclick="clearAllChat()">🗑️</button>
        </div>
    </div>
    
    <div class="chat-messages" id="messageContainer"></div>
    
    <div class="chat-input-area">
        <label for="imageInput" class="icon-btn">📷</label>
        <input type="file" id="imageInput" accept="image/*">
        <button class="icon-btn" id="micBtn">🎙️</button>
        <input type="text" id="msgInput" class="input-box" placeholder="Type message...">
        <button class="icon-btn send-btn" id="sendBtn">➔</button>
    </div>
</div>

<script>
    const socket = io();
    let myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
    let myUsername = '';

    function joinRoom() {
        const uName = document.getElementById('username').value.trim();
        const rName = document.getElementById('roomName').value.trim();
        const rPass = document.getElementById('roomPass').value.trim();
        
        if(!uName || !rName) return alert("Name and Room Name are required!");
        
        myUsername = uName;
        socket.emit('join_room', { username: uName, roomName: rName, password: rPass });
    }

    socket.on('login_error', (msg) => alert(msg));

    socket.on('login_success', (history) => {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('chatContainer').style.display = 'flex';
        document.getElementById('roomTitle').innerText = document.getElementById('roomName').value;
        document.getElementById('userNameDisplay').innerText = "Logged in as " + myUsername;
        
        const container = document.getElementById('messageContainer');
        container.innerHTML = '';
        history.forEach(item => appendMessage(item, item.userId === myUserId ? 'sent' : 'received'));
    });

    socket.on('system_message', (msg) => {
        const div = document.createElement('div');
        div.className = 'sys-msg';
        div.innerText = msg;
        document.getElementById('messageContainer').appendChild(div);
    });

    // Messages Logic
    function sendMessage() {
        const text = document.getElementById('msgInput').value.trim();
        if (text) {
            const data = { id: 'msg_'+Date.now(), userId: myUserId, text: text };
            appendMessage({...data, senderName: myUsername}, 'sent');
            socket.emit('send_message', data);
            document.getElementById('msgInput').value = '';
        }
    }
    
    document.getElementById('sendBtn').onclick = sendMessage;
    document.getElementById('msgInput').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

    socket.on('receive_message', (data) => appendMessage(data, 'received'));

    // Image Logic
    document.getElementById('imageInput').onchange = function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const data = { id: 'msg_'+Date.now(), userId: myUserId, image: event.target.result };
                appendMessage({...data, senderName: myUsername}, 'sent');
                socket.emit('send_image', data);
            };
            reader.readAsDataURL(file);
        }
    };
    socket.on('receive_image', (data) => appendMessage(data, 'received'));

    // Audio Logic
    let mediaRecorder, audioChunks = [], isRecording = false;
    document.getElementById('micBtn').onclick = async function() {
        const btn = this;
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    const reader = new FileReader();
                    reader.onload = e => {
                        const data = { id: 'msg_'+Date.now(), userId: myUserId, audio: e.target.result };
                        appendMessage({...data, senderName: myUsername}, 'sent');
                        socket.emit('send_audio', data);
                    };
                    reader.readAsDataURL(new Blob(audioChunks));
                };
                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
            } catch(e) { alert("Mic permission needed"); }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.classList.remove('recording');
        }
    };
    socket.on('receive_audio', (data) => appendMessage(data, 'received'));

    function appendMessage(data, type) {
        if(document.getElementById(data.id)) return;
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.id = data.id;

        let html = '';
        if(type === 'received' && data.senderName) html += `<div class="sender-name">${data.senderName}</div>`;
        if(data.text) html += `<div>${data.text}</div>`;
        if(data.image) html += `<img src="${data.image}">`;
        if(data.audio) html += `<audio controls src="${data.audio}"></audio>`;
        html += `<span class="delete-btn" onclick="deleteMessage('${data.id}')">✕</span>`;

        msgDiv.innerHTML = html;
        const container = document.getElementById('messageContainer');
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }

    window.deleteMessage = (id) => { socket.emit('delete_for_everyone', id); document.getElementById(id)?.remove(); };
    socket.on('message_deleted', (id) => document.getElementById(id)?.remove());

    window.clearAllChat = () => { if(confirm("Clear room chat?")) socket.emit('clear_all_chat'); };
    socket.on('chat_cleared', () => document.getElementById('messageContainer').innerHTML = '');
</script>
</body>
</html>
